<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Qwixx</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/7d59c9faf1.js" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="display-center">
        <div class="buttons">
            <button type="button" id="dice-btn">Roll</button>
            <button type="button" id="cancel-btn" disabled>Undo</button>
        </div>
        <div id="dice"></div>
    </div>
    <div class="grids">
        <div id="grid-1" class="grid" data-main-player="true">
            <div data-row-color="red">
                <span data-number="2" data-color="red">2</span>
                <span data-number="3" data-color="red">3</span>
                <span data-number="4" data-color="red">4</span>
                <span data-number="5" data-color="red">5</span>
                <span data-number="6" data-color="red">6</span>
                <span data-number="7" data-color="red">7</span>
                <span data-number="8" data-color="red">8</span>
                <span data-number="9" data-color="red">9</span>
                <span data-number="10" data-color="red">10</span>
                <span data-number="11" data-color="red">11</span>
                <span data-number="12" data-color="red" data-last-cell="true">12</span>
                <span data-lock="true" data-color="red"><i class="fa-solid fa-unlock"></i></span>
            </div>
            <div data-row-color="yellow">
                <span data-number="2" data-color="yellow">2</span>
                <span data-number="3" data-color="yellow">3</span>
                <span data-number="4" data-color="yellow">4</span>
                <span data-number="5" data-color="yellow">5</span>
                <span data-number="6" data-color="yellow">6</span>
                <span data-number="7" data-color="yellow">7</span>
                <span data-number="8" data-color="yellow">8</span>
                <span data-number="9" data-color="yellow">9</span>
                <span data-number="10" data-color="yellow">10</span>
                <span data-number="11" data-color="yellow" >11</span>
                <span data-number="12" data-color="yellow" data-last-cell="true">12</span>
                <span data-lock="true" data-color="yellow"><i class="fa-solid fa-unlock"></i></span>
            </div>
            <div data-row-color="green">
                <span data-number="12" data-color="green">12</span>
                <span data-number="11" data-color="green">11</span>
                <span data-number="10" data-color="green">10</span>
                <span data-number="9" data-color="green">9</span>
                <span data-number="8" data-color="green">8</span>
                <span data-number="7" data-color="green">7</span>
                <span data-number="6" data-color="green">6</span>
                <span data-number="5" data-color="green">5</span>
                <span data-number="4" data-color="green">4</span>
                <span data-number="3" data-color="green">3</span>
                <span data-number="2" data-color="green" data-last-cell="true">2</span>
                <span data-lock="true" data-color="green"><i class="fa-solid fa-unlock"></i></span>
            </div>
            <div data-row-color="blue">
                <span data-number="12" data-color="blue">12</span>
                <span data-number="11" data-color="blue">11</span>
                <span data-number="10" data-color="blue">10</span>
                <span data-number="9" data-color="blue">9</span>
                <span data-number="8" data-color="blue">8</span>
                <span data-number="7" data-color="blue">7</span>
                <span data-number="6" data-color="blue">6</span>
                <span data-number="5" data-color="blue">5</span>
                <span data-number="4" data-color="blue">4</span>
                <span data-number="3" data-color="blue">3</span>
                <span data-number="2" data-color="blue" data-last-cell="true">2</span>
                <span data-lock="true" data-color="blue"><i class="fa-solid fa-unlock"></i></span>
            </div>
            <div data-row-penalty="true" class="penalty">
                <span data-penalty="1"></span>
                <span data-penalty="2"></span>
                <span data-penalty="3"></span>
                <span data-penalty="4"></span>
            </div>
        </div>
        <div id="grid-2" class="grid">
            <div data-row-color="red">
                <span data-number="2" data-color="red">2</span>
                <span data-number="3" data-color="red">3</span>
                <span data-number="4" data-color="red">4</span>
                <span data-number="5" data-color="red">5</span>
                <span data-number="6" data-color="red">6</span>
                <span data-number="7" data-color="red">7</span>
                <span data-number="8" data-color="red">8</span>
                <span data-number="9" data-color="red">9</span>
                <span data-number="10" data-color="red">10</span>
                <span data-number="11" data-color="red">11</span>
                <span data-number="12" data-color="red" data-last-cell="true">12</span>
                <span data-lock="true" data-color="red"><i class="fa-solid fa-unlock"></i></span>
            </div>
            <div data-row-color="yellow">
                <span data-number="2" data-color="yellow">2</span>
                <span data-number="3" data-color="yellow">3</span>
                <span data-number="4" data-color="yellow">4</span>
                <span data-number="5" data-color="yellow">5</span>
                <span data-number="6" data-color="yellow">6</span>
                <span data-number="7" data-color="yellow">7</span>
                <span data-number="8" data-color="yellow">8</span>
                <span data-number="9" data-color="yellow">9</span>
                <span data-number="10" data-color="yellow">10</span>
                <span data-number="11" data-color="yellow" >11</span>
                <span data-number="12" data-color="yellow" data-last-cell="true">12</span>
                <span data-lock="true" data-color="yellow"><i class="fa-solid fa-unlock"></i></span>
            </div>
            <div data-row-color="green">
                <span data-number="12" data-color="green">12</span>
                <span data-number="11" data-color="green">11</span>
                <span data-number="10" data-color="green">10</span>
                <span data-number="9" data-color="green">9</span>
                <span data-number="8" data-color="green">8</span>
                <span data-number="7" data-color="green">7</span>
                <span data-number="6" data-color="green">6</span>
                <span data-number="5" data-color="green">5</span>
                <span data-number="4" data-color="green">4</span>
                <span data-number="3" data-color="green">3</span>
                <span data-number="2" data-color="green" data-last-cell="true">2</span>
                <span data-lock="true" data-color="green"><i class="fa-solid fa-unlock"></i></span>
            </div>
            <div data-row-color="blue">
                <span data-number="12" data-color="blue">12</span>
                <span data-number="11" data-color="blue">11</span>
                <span data-number="10" data-color="blue">10</span>
                <span data-number="9" data-color="blue">9</span>
                <span data-number="8" data-color="blue">8</span>
                <span data-number="7" data-color="blue">7</span>
                <span data-number="6" data-color="blue">6</span>
                <span data-number="5" data-color="blue">5</span>
                <span data-number="4" data-color="blue">4</span>
                <span data-number="3" data-color="blue">3</span>
                <span data-number="2" data-color="blue" data-last-cell="true">2</span>
                <span data-lock="true" data-color="blue"><i class="fa-solid fa-unlock"></i></span>
            </div>
            <div data-row-penalty="true" class="penalty">
                <span data-penalty="1"></span>
                <span data-penalty="2"></span>
                <span data-penalty="3"></span>
                <span data-penalty="4"></span>
            </div>
        </div>
    </div>
    <div id="message" class="display-center"></div>
</body>
</html>
